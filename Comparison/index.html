<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Comparison of Text to Speech Models</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet" />
  <style>
    /* ICICI Bank Colors */
    :root {
      --icici-red: #B02A30;
      --icici-orange: #F99D27;
      --icici-blue: #005B75;
      --background-light: #f7f8fa;
      --card-bg: #fff7e6; /* light saffron tint */
      --text-dark: #222;
      --text-muted: #555;
    }

    body {
      background: var(--background-light);
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text-dark);
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(176, 42, 48, 0.15);
      padding: 32px 24px 24px 24px;
      border-top: 8px solid var(--icici-red);
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 32px;
      letter-spacing: 0.02em;
      color: var(--icici-red);
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .audio-comparison {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .audio-card {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 18px 22px;
      box-shadow: 0 2px 10px rgba(0, 91, 117, 0.15);
      transition: box-shadow 0.3s ease;
      border-left: 6px solid var(--icici-orange);
    }

    .audio-card:hover {
      box-shadow: 0 6px 20px rgba(176, 42, 48, 0.3);
      border-left-color: var(--icici-red);
    }

    .audio-info {
      flex: 1;
    }

    .model-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--icici-blue);
      margin-bottom: 4px;
    }

    .provider-name {
      font-size: 1rem;
      color: var(--icici-red);
      font-weight: 600;
      margin-bottom: 8px;
    }

    audio {
      width: 210px;
      outline: none;
      margin-left: 28px;
      border-radius: 6px;
      box-shadow: 0 0 6px rgba(0, 91, 117, 0.2);
    }

    @media (max-width: 600px) {
      .container {
        padding: 16px 12px;
      }
      .audio-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        border-left: none;
        border-top: 6px solid var(--icici-orange);
      }
      .audio-card:hover {
        border-top-color: var(--icici-red);
      }
      audio {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Comparison of Text to Speech Models</h1>
    <div class="audio-comparison">

      <div class="audio-card">
        <div class="audio-info">
          <div class="model-name">Kokoro TTS</div>
          <div class="provider-name">Provider: Hugging Face</div>
        </div>
        <audio controls>
          <source src="kokoro.wav" type="audio/wav" />
          Your browser does not support the audio element.
        </audio>
      </div>

      <div class="audio-card">
        <div class="audio-info">
          <div class="model-name">Parler TTS</div>
          <div class="provider-name">Provider: AI4Bharat</div>
        </div>
        <audio controls>
          <source src="parler.wav" type="audio/wav" />
          Your browser does not support the audio element.
        </audio>
      </div>

      <div class="audio-card">
        <div class="audio-info">
          <div class="model-name">Google TTS</div>
          <div class="provider-name">Provider: Google Cloud</div>
        </div>
        <audio controls>
          <source src="google.wav" type="audio/wav" />
          Your browser does not support the audio element.
        </audio>
      </div>

    </div>
  </div>
</body>
</html>
